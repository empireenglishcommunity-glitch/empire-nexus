name: discord-learning-bot tests

# Run on any push or PR that touches the bot (or this workflow itself).
on:
  push:
    paths:
      - "bots/discord-learning-bot/**"
      - ".github/workflows/learning-bot-test.yml"
  pull_request:
    paths:
      - "bots/discord-learning-bot/**"
      - ".github/workflows/learning-bot-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bots/discord-learning-bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Syntax check (all .py files compile)
        run: python -m py_compile run.py && python -c "import src"

      # Content coverage ledger. The hard gate already runs inside the test
      # suite (tests/test_coverage_ledger.py); this step prints the table so
      # the delivery numbers are visible in the build log without digging
      # through test output, and exits non-zero if any authored atom has no
      # route to a student.
      - name: Content coverage ledger (fails on any orphaned atom)
        run: python -m src.coverage_ledger

      # Audio quality gate (Empire English Chronicles — see docs/AUDIO-STANDARDS.md).
      # The gate's own correctness is enforced by tests/test_audio_qa.py above
      # (proven to fail on bad audio, pass on good). This step additionally asserts
      # the analyser MODULE imports and its standard is self-consistent, so a change
      # that breaks the gate fails the build here too — spec R4.5.
      - name: Audio quality standard is loadable and complete
        run: |
          python -c "from src import audio_standards as s; d=s.summary(); \
          assert d['bandwidth_is_diagnostic_only'] is True; \
          assert 'wer' in d['critical_metrics']; \
          print('audio standard OK:', d)"
