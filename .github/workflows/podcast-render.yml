name: podcast render (sawt)

# OFFLINE renderer for Podcast Studio (Sawt صوت). The Discord bot runs in a
# 512MB / 0.5-CPU container and cannot host a TTS engine, so episode audio is
# synthesized HERE and downloaded as an artifact, then attached to an episode
# with /create-episode. See bots/discord-learning-bot/scripts/render_podcast_episode.py
# and content/podcast-scripts/README.md.
#
# ONE engine voices everyone: Chatterbox Multilingual (MIT, CPU) clones a
# reference clip into whichever language each run needs. The owner speaks BOTH
# English and Arabic in the owner's own cloned voice (from voice_ref_url); each
# co-host gets a distinct reference voice. Because it is multilingual, Arabic is
# spoken as Arabic (not letter-by-letter). Voice cloning is owner-only and
# consent-gated (see !sawt-consent in Discord).
on:
  workflow_dispatch:
    inputs:
      script_path:
        description: "Script file, relative to bots/discord-learning-bot (e.g. content/podcast-scripts/a1-coffee.txt)"
        required: true
      level:
        description: "CEFR level (A1–C2) — sets the delivery pace"
        default: "A1"
      voice_ref_url:
        description: "Direct URL to the owner's ~10s voice reference clip (owner's lines are cloned from it)"
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: bots/discord-learning-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the script exists + print the render plan
        env:
          SCRIPT_PATH: ${{ inputs.script_path }}
          LEVEL: ${{ inputs.level }}
        run: |
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "::error::script_path '$SCRIPT_PATH' not found under bots/discord-learning-bot"
            exit 1
          fi
          pip install --quiet numpy
          python3 scripts/render_podcast_episode.py \
            --script "$SCRIPT_PATH" --level "$LEVEL" --plan

      - name: Install the multilingual TTS engine (Chatterbox Multilingual)
        run: |
          # ffmpeg: lets librosa decode any reference clip (m4a/ogg/…) → clean WAV.
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || true
          # setuptools must be present or chatterbox's perth watermarker init can
          # resolve to None (resemble-ai/chatterbox#198); the renderer also
          # monkeypatches that watermarker to a no-op as a belt-and-suspenders.
          pip install --quiet setuptools soundfile librosa numpy
          # chatterbox-tts ships ChatterboxMultilingualTTS (chatterbox.mtl_tts).
          pip install --quiet chatterbox-tts

      - name: Fetch the owner voice reference clip (if provided)
        id: refclip
        if: ${{ inputs.voice_ref_url != '' }}
        env:
          REF_URL: ${{ inputs.voice_ref_url }}
        run: |
          # Strip any query string (Discord CDN URLs carry ?ex=&is=&hm=) BEFORE
          # reading the extension, else "m4a?ex=..." is treated as an unknown ext.
          clean_url="${REF_URL%%\?*}"
          ext="${clean_url##*.}"
          case "$ext" in wav|mp3|m4a|ogg|flac|webm) ;; *) ext="bin" ;; esac
          raw="owner_voice_raw.$ext"
          curl -sSL --retry 3 --fail -o "$raw" "$REF_URL"
          echo "  downloaded reference clip -> $raw ($(stat -c%s "$raw") bytes, ext=$ext)"
          # Re-encode to a real 24kHz mono PCM WAV with ffmpeg so the loader never
          # sees a surprising container (the renderer also re-decodes defensively).
          out="owner_voice_ref.wav"
          if command -v ffmpeg >/dev/null 2>&1 && ffmpeg -y -i "$raw" -ac 1 -ar 24000 "$out" >/dev/null 2>&1; then
            echo "  re-encoded -> $out ($(stat -c%s "$out") bytes)"
          else
            echo "  ffmpeg re-encode skipped/failed; passing raw file to the renderer"
            out="$raw"
          fi
          echo "ref_path=$out" >> "$GITHUB_OUTPUT"

      - name: Render the episode
        env:
          SCRIPT_PATH: ${{ inputs.script_path }}
          LEVEL: ${{ inputs.level }}
          REF_PATH: ${{ steps.refclip.outputs.ref_path }}
        run: |
          python3 scripts/render_podcast_episode.py \
            --script "$SCRIPT_PATH" \
            --level "$LEVEL" \
            --out output/episode.mp3 \
            ${REF_PATH:+--ref-clip "$REF_PATH"}

      - name: Upload the episode audio
        uses: actions/upload-artifact@v4
        with:
          name: episode-audio
          path: bots/discord-learning-bot/output/episode.mp3
          if-no-files-found: error
          retention-days: 7
