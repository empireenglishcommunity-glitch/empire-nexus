name: podcast render (sawt)

# OFFLINE renderer for Podcast Studio (Sawt صوت). The Discord bot runs in a
# 512MB / 0.5-CPU container and cannot host a TTS engine, so episode audio is
# synthesized HERE and downloaded as an artifact, then attached to an episode
# with /create-episode. See bots/discord-learning-bot/scripts/render_podcast_episode.py
# and content/podcast-scripts/README.md.
#
# ONE engine voices everyone: Chatterbox Multilingual (MIT, CPU) clones a
# reference clip into whichever language each run needs. The owner speaks BOTH
# English and Arabic in the owner's own cloned voice (from voice_ref_url); each
# co-host gets a distinct reference voice. Because it is multilingual, Arabic is
# spoken as Arabic (not letter-by-letter). Voice cloning is owner-only and
# consent-gated (see !sawt-consent in Discord).
on:
  workflow_dispatch:
    inputs:
      script_path:
        description: "Script file, relative to bots/discord-learning-bot (e.g. content/podcast-scripts/a1-coffee.txt)"
        required: true
      level:
        description: "CEFR level (A1–C2) — sets the delivery pace"
        default: "A1"
      voice_ref_url:
        description: "URL to the owner's ENGLISH voice reference clip (owner's English lines cloned from it)"
        default: ""
      voice_ref_ar_url:
        description: "URL to the owner's ARABIC (MSA) voice reference clip — best Arabic quality (falls back to the English clip if empty)"
        default: ""
      story_mode:
        description: "Storytelling mode (Empire Chronicles): English cast + sound design"
        type: boolean
        default: false
      voice_ref_mai_url:
        description: "Story cast: Mai's consented voice reference clip URL (optional)"
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: bots/discord-learning-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the script exists + print the render plan
        env:
          SCRIPT_PATH: ${{ inputs.script_path }}
          LEVEL: ${{ inputs.level }}
        run: |
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "::error::script_path '$SCRIPT_PATH' not found under bots/discord-learning-bot"
            exit 1
          fi
          pip install --quiet numpy
          python3 scripts/render_podcast_episode.py \
            --script "$SCRIPT_PATH" --level "$LEVEL" --plan

      - name: Install the multilingual TTS engine (Chatterbox Multilingual)
        run: |
          # ffmpeg: lets librosa decode any reference clip (m4a/ogg/…) → clean WAV.
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || true
          # setuptools must be present or chatterbox's perth watermarker init can
          # resolve to None (resemble-ai/chatterbox#198); the renderer also
          # monkeypatches that watermarker to a no-op as a belt-and-suspenders.
          pip install --quiet setuptools soundfile librosa numpy scipy
          # chatterbox-tts ships ChatterboxMultilingualTTS (chatterbox.mtl_tts).
          pip install --quiet chatterbox-tts
          # text2tashkeel: offline Arabic diacritization (ONNX) — restores the
          # vowels/shaddas so Arabic is pronounced correctly, not letter-guessed.
          # Best-effort: the renderer falls back to raw Arabic if it's missing.
          pip install --quiet text2tashkeel || echo "text2tashkeel install failed — Arabic will render without added tashkeel"

      - name: Fetch the owner voice reference clips (English + Arabic, if provided)
        id: refclip
        if: ${{ inputs.voice_ref_url != '' || inputs.voice_ref_ar_url != '' || inputs.voice_ref_mai_url != '' }}
        env:
          REF_URL_EN: ${{ inputs.voice_ref_url }}
          REF_URL_AR: ${{ inputs.voice_ref_ar_url }}
          REF_URL_MAI: ${{ inputs.voice_ref_mai_url }}
        run: |
          # Download a URL and re-encode to clean 24kHz mono PCM WAV. Strips the
          # query string (Discord CDN URLs carry ?ex=&is=&hm=) before reading ext.
          fetch_ref() {
            local url="$1" out="$2"
            [ -z "$url" ] && return 0
            local clean="${url%%\?*}" ext="${clean##*.}"
            case "$ext" in wav|mp3|m4a|ogg|flac|webm) ;; *) ext="bin" ;; esac
            local raw="raw_${out%.wav}.$ext"
            curl -sSL --retry 3 --fail -o "$raw" "$url"
            echo "  downloaded $url -> $raw ($(stat -c%s "$raw") bytes)"
            if command -v ffmpeg >/dev/null 2>&1 && ffmpeg -y -i "$raw" -ac 1 -ar 24000 "$out" >/dev/null 2>&1; then
              echo "  re-encoded -> $out ($(stat -c%s "$out") bytes)"
            else
              cp "$raw" "$out"
            fi
          }
          fetch_ref "$REF_URL_EN" "owner_voice_ref.wav"
          fetch_ref "$REF_URL_AR" "owner_voice_ref_ar.wav"
          fetch_ref "$REF_URL_MAI" "mai_voice_ref.wav"
          [ -f owner_voice_ref.wav ]    && echo "ref_en=owner_voice_ref.wav"    >> "$GITHUB_OUTPUT"
          [ -f owner_voice_ref_ar.wav ] && echo "ref_ar=owner_voice_ref_ar.wav" >> "$GITHUB_OUTPUT"
          [ -f mai_voice_ref.wav ]      && echo "ref_mai=mai_voice_ref.wav"      >> "$GITHUB_OUTPUT"

      - name: Render the episode
        env:
          SCRIPT_PATH: ${{ inputs.script_path }}
          LEVEL: ${{ inputs.level }}
          STORY: ${{ inputs.story_mode }}
          REF_EN: ${{ steps.refclip.outputs.ref_en }}
          REF_AR: ${{ steps.refclip.outputs.ref_ar }}
          REF_MAI: ${{ steps.refclip.outputs.ref_mai }}
        run: |
          python3 scripts/render_podcast_episode.py \
            --script "$SCRIPT_PATH" \
            --level "$LEVEL" \
            --out output/episode.mp3 \
            ${STORY:+$([ "$STORY" = "true" ] && echo --story)} \
            ${REF_EN:+--ref-clip "$REF_EN"} \
            ${REF_AR:+--ref-clip-ar "$REF_AR"} \
            ${REF_MAI:+--ref-mai "$REF_MAI"}

      - name: Upload the episode audio
        uses: actions/upload-artifact@v4
        with:
          name: episode-audio
          path: bots/discord-learning-bot/output/episode.mp3
          if-no-files-found: error
          retention-days: 7
