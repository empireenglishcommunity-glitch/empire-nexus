name: podcast daily (empire chronicles)

# The DAILY automation for the Empire Chronicles serialized story. Once a day it:
#   1. generates the next episode's script (continuing the audience's winning
#      vote, read from content/podcast-scripts/story-state.json),
#   2. renders it to an MP3 with the cast + real sound design,
#   3. commits the script + MP3 + episode-meta.json back to the repo,
# so the bot can pick up the newest ready episode and post it to the hidden
# podcast channel for the owner's approval (students only see it after approval).
#
# Voices are SELF-CONTAINED: every character (narrator, Maya, Leo, extras) has a
# distinct, freely-licensed reference clip committed in content/sfx/voices/, so
# this workflow needs NO secrets and NO external URLs to render — it just works.
#
# OPTIONAL overrides (only if you want the owner's own / Mai's consented voice):
# set repo secrets OWNER_VOICE_URL and/or MAI_VOICE_URL to stable, non-expiring
# direct URLs. Leave them unset and the committed default voices are used.
# NOTE: Discord CDN URLs expire (~24h) and must NOT be used here — use a stable
# host (a GitHub release asset, etc.) or just rely on the committed defaults.
# The bot writes the winning choice into story-state.json before this runs; you
# can also override it manually via the workflow_dispatch input.
on:
  schedule:
    # 03:00 UTC = 07:00 Asia/Dubai — the episode is ready before the morning.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      winning_choice:
        description: "Override the audience's winning choice to continue from"
        default: ""

concurrency:
  group: podcast-daily
  cancel-in-progress: false

jobs:
  build-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        working-directory: bots/discord-learning-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MAIN deps (generator + assembly + QA gate — NO TTS engine)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || true
          # The main interpreter runs the LLM generator, audio assembly/mastering,
          # and the QA gate — none of which need a TTS engine, so no numpy conflict.
          pip install --quiet aiohttp python-dotenv setuptools
          pip install --quiet soundfile librosa "numpy>=2" scipy pyloudnorm
          # ASR for the QA gate's WER check (a CRITICAL metric — if it can't be
          # measured the gate fails closed). faster-whisper runs on CPU.
          pip install --quiet faster-whisper

      - name: Build the Kokoro TTS engine venv
        run: |
          # v1 is KOKORO-ONLY: the whole cast (incl. Maya) is voiced by Kokoro, so
          # there is no Chatterbox clone engine to isolate. One venv, fast + reliable.
          # (When Mai's cloned voice is restored, add a separate numpy<2 chatterbox
          # venv here + set EEC_CLONE_PYTHON below — the isolation code still supports
          # it.) The venv also needs the renderer's per-line deps (librosa/soundfile/
          # scipy) and python-dotenv (src.config is imported for CEFR pace).
          set -e
          python3 -m venv "$RUNNER_TEMP/venv-kokoro"
          "$RUNNER_TEMP/venv-kokoro/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/venv-kokoro/bin/pip" install --quiet \
            "kokoro-onnx==0.4.9" soundfile librosa scipy "numpy>=2.0.2" python-dotenv
          "$RUNNER_TEMP/venv-kokoro/bin/python" -c "import kokoro_onnx, numpy; print('kokoro venv ok, numpy', numpy.__version__)"

      - name: Generate the next episode script (continuing the winning vote)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WINNING_CHOICE: ${{ inputs.winning_choice }}
        run: |
          python3 scripts/generate_daily_story.py \
            --out-dir content/podcast-scripts \
            ${WINNING_CHOICE:+--winning-choice "$WINNING_CHOICE"}

      - name: Render the episode (GATED v2 — isolated engines + QA gate)
        env:
          # Turn on engine isolation and point Kokoro at its venv. The v2 renderer
          # runs scripts/voice_worker.py under it per line. (v1 is Kokoro-only, so no
          # EEC_CLONE_PYTHON — restore it alongside a chatterbox venv for Mai's voice.)
          EEC_ISOLATE_ENGINES: "1"
          EEC_KOKORO_PYTHON: ${{ runner.temp }}/venv-kokoro/bin/python
          # Kokoro model cache in a writable path (default /root/.cache is not
          # writable on the runner). The worker venv reads this env too.
          KOKORO_CACHE_DIR: ${{ runner.temp }}/kokoro-cache
        run: |
          META=content/podcast-scripts/episode-meta.json
          SCRIPT_PATH=$(python3 -c "import json;print(json.load(open('$META'))['script_path'])")
          SLUG=$(python3 -c "import json;print(json.load(open('$META'))['slug'])")
          # The arc engine picks a MOOD per episode (spec 3.7/Phase 4); the bed is
          # chosen from the owned Podcast Lab by it. episode_number varies (but keeps
          # reproducible) which bed is picked. Older meta falls back to 'warm'/0.
          MOOD=$(python3 -c "import json;print(json.load(open('$META')).get('mood') or 'warm')")
          EPNUM=$(python3 -c "import json;print(json.load(open('$META')).get('episode_number') or 0)")
          mkdir -p content/podcast-audio "$KOKORO_CACHE_DIR"
          # GATED renderer: renders with the v2 cast engine (isolated per-engine
          # subprocesses), then REFUSES to emit an episode that fails the audio QA
          # gate. Non-zero exit => nothing written => the commit step finds nothing
          # new and the bot keeps yesterday's state (fail-closed, spec Phase 2).
          python3 scripts/render_episode_gated.py \
            --script "$SCRIPT_PATH" \
            --music "$MOOD" \
            --seed "$EPNUM" \
            --out "content/podcast-audio/$SLUG.mp3" \
            --report "content/podcast-audio/$SLUG.qa.json"
          # Fold the render's licence credit line into the meta for the bot's post.
          python3 scripts/merge_credit_into_meta.py \
            "$META" "content/podcast-audio/$SLUG.qa.json" || true

      - name: Commit the new episode (script + audio + meta) for the bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/podcast-scripts/ content/podcast-audio/
          if git diff --cached --quiet; then
            echo "nothing new to commit"; exit 0
          fi
          SLUG=$(python3 -c "import json;print(json.load(open('content/podcast-scripts/episode-meta.json'))['slug'])")
          git commit -m "chore(sawt): daily Empire Chronicles episode $SLUG [skip ci]"
          git push
          echo "committed episode $SLUG"
